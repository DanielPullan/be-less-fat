{# Your activity: settings.profile_stats(user, logs, counts) #}
    <section class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm lg:col-span-2">
        <h2 class="text-lg font-bold text-slate-900 mb-4">Your activity</h2>
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
            {% for label, value in stats %}
            <div class="p-4 rounded-xl border border-slate-200">
                <span class="text-sm font-semibold text-slate-500 block">{{ label }}</span>
                <span class="text-3xl font-bold text-slate-900 tabular-nums">{{ value }}</span>
            </div>
            {% endfor %}
        </div>
    </section>
