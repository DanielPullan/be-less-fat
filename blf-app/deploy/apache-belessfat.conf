# Apache virtual host for Be Less Fat, alongside the server's other sites (SecureMy.School, Johto and the rest).
# Apache faces the internet and passes requests to gunicorn, which listens only on this server (127.0.0.1:8003).
#
# Needs a DNS A record for blf.3264.uk pointing at this server.
# Install:
#   sudo a2enmod proxy proxy_http headers
#   sudo cp deploy/apache-belessfat.conf /etc/apache2/sites-available/blf.3264.uk.conf
#   sudo a2ensite blf.3264.uk
#   sudo apache2ctl configtest && sudo systemctl reload apache2
# Then add HTTPS:
#   sudo certbot --apache -d blf.3264.uk
# certbot makes an HTTPS copy of this site (blf.3264.uk-le-ssl.conf) and redirects http to https.
<VirtualHost *:80>
    ServerName blf.3264.uk

    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:8003/
    ProxyPassReverse / http://127.0.0.1:8003/
    ProxyTimeout 120
    # mod_proxy adds the visitor's IP to X-Forwarded-For itself; the app trusts the last entry (BEHIND_PROXY=1),
    # so a faked header can't change it. Tell the app whether the visitor used https.
    RequestHeader set X-Forwarded-Proto expr=%{REQUEST_SCHEME}
    # 20 MB, matching MAX_UPLOAD_MB (weigh-in and users CSVs are the only uploads)
    LimitRequestBody 20971520

    ErrorLog ${APACHE_LOG_DIR}/belessfat-error.log
    CustomLog ${APACHE_LOG_DIR}/belessfat-access.log combined
</VirtualHost>
