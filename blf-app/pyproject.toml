[project]
name = "blf-app"
version = "0.1.0"
description = "Be Less Fat: track your weight and food, see your BMI and a daily calorie target."
authors = [{ name = "Daniel Pullan", email = "dan@3264.uk" }]
readme = "README.rst"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0",
]

[project.scripts]
blf = "blf_app.app:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["blf_app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
