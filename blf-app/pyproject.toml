[project]
name = "be-less-fat"
version = "0.1.0"
description = "Be Less Fat: track your food and weight, with a daily calorie target. Built on Kanto."
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0.2",
    "flask-sqlalchemy>=3.1.1",
    "flask-login>=0.6.3",
    "flask-wtf>=1.2",
    "flask-migrate>=4.1.0",
    "python-dotenv>=1.0",
    "pyotp>=2.9",
    "qrcode>=8.0",
    "cryptography>=43",
    "webauthn>=2.5",
    "gunicorn>=23 ; sys_platform != 'win32'",
    "waitress>=3.0.2 ; sys_platform == 'win32'",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
