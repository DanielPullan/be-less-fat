{% include 'header.html' %}

<div class="row">
    <div class="col-12">
        <h1>{{ title }}</h1>
        <p>This is a work in progress. Please treat this as a test environment. Only use dummy data.</p>
    </div>
</div>

<div class="row">
    <div class="col-12">
        <form method="POST">
              Username: <input type="text" name="username" required><br>
              Password: <input type="password" name="password" minlength="6" required><br>
              Pin: <input type="password" name="pin" pattern="[0-9]*" inputmode="numeric" required><br>
              <input type="submit" value="Register"><br>
          </form>
        <p>Already have an account? <a href="/login">Login</a>.</p>
    </div>
</div>
