{% extends "base.html" %}
{% from '_macros.html' import card, field, label_class, btn_primary, csrf with context %}
{% block content %}
<div class="max-w-md mx-auto px-6 py-16 sm:py-20">
    <div class="{{ card }} p-8">
        <h1 class="text-2xl font-bold text-slate-900 mb-6 text-center">Log in</h1>
        <form method="POST" class="space-y-4">
            {{ csrf() }}
            <div>
                <label for="username" class="{{ label_class }}">Username</label>
                <input type="text" id="username" name="username" autocomplete="username" required autofocus class="{{ field }}">
            </div>
            <div>
                <label for="password" class="{{ label_class }}">Password</label>
                <input type="password" id="password" name="password" autocomplete="current-password" required class="{{ field }}">
            </div>
            <div>
                <label for="pin" class="{{ label_class }}">Pin</label>
                <input type="password" id="pin" name="pin" inputmode="numeric" pattern="[0-9]*" required class="{{ field }}">
            </div>
            <button type="submit" class="{{ btn_primary }} w-full">Log in</button>
        </form>
        <p class="mt-6 text-center text-sm text-slate-600">No account? <a href="{{ url_for('register') }}" class="font-semibold text-forest-700 hover:underline">Create one</a></p>
    </div>
</div>
{% endblock %}
